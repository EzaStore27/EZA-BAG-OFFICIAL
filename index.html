<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EZA BAG OFFICIAL</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ee4d2d">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#333;
}

/* HEADER */

header{
    position:fixed;
    top:0;
    width:100%;
    z-index:1000;
    background:#ee4d2d;
    padding:15px 0;
    box-shadow:0 3px 10px rgba(0,0,0,0.15);
}

nav{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
}

.logo{
    color:white;
    font-size:1.8rem;
    font-weight:bold;
}

.cart-icon{
    position:relative;
    color:white;
    font-size:1.5rem;
    cursor:pointer;
}

.cart-count{
    position:absolute;
    top:-10px;
    right:-10px;
    background:white;
    color:#ee4d2d;
    width:20px;
    height:20px;
    border-radius:50%;
    font-size:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
}

/* HERO */

.hero{
    margin-top:70px;
    background:
    linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),
    url('https://images.unsplash.com/photo-1584917865442-de89df76afd3?q=80&w=1200&auto=format&fit=crop');

    background-size:cover;
    background-position:center;
    min-height:350px;

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;

    color:white;
    padding:20px;
}

.hero-content h1{
    font-size:3rem;
    margin-bottom:15px;
}

.hero-content p{
    font-size:1.2rem;
}

/* PRODUCTS */

.products{
    max-width:1200px;
    margin:auto;
    padding:40px 20px;
}

.section-title{
    text-align:center;
    font-size:2rem;
    margin-bottom:30px;
}

/* SEARCH */

.search-container{
    max-width:700px;
    margin:20px auto 30px;
    display:flex;
    background:white;
    border-radius:50px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.search-container input{
    flex:1;
    border:none;
    padding:15px 20px;
    font-size:1rem;
    outline:none;
}

.search-container button{
    width:70px;
    border:none;
    background:#ee4d2d;
    color:white;
    font-size:1.2rem;
    cursor:pointer;
}

/* CATEGORY */

.categories{
    display:flex;
    gap:15px;
    overflow-x:auto;
    margin-bottom:30px;
    padding-bottom:10px;
}

.category-item{
    min-width:max-content;
    background:white;
    padding:12px 20px;
    border-radius:50px;
    cursor:pointer;
    font-weight:bold;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
    transition:0.3s;
}

.category-item:hover{
    background:#ee4d2d;
    color:white;
}

/* PRODUCT GRID */

.products-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.product-card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    transition:0.3s;
}

.product-card:hover{
    transform:translateY(-8px);
}

.product-image{
    width:80%;
    height:220px;
    object-fit:contain;
    display:block;
    margin:20px auto;
    cursor:pointer;
}

.product-info{
    padding:20px;
}

.product-info h3{
    margin-bottom:10px;
}

.product-price{
    color:#ee4d2d;
    font-size:1.5rem;
    font-weight:bold;
    margin-bottom:15px;
}

.product-add-to-cart{
    width:100%;
    border:none;
    padding:12px;
    border-radius:10px;
    background:#ee4d2d;
    color:white;
    cursor:pointer;
    font-size:1rem;
}

/* CART */

.cart-modal{
    display:none;
    position:fixed;
    z-index:3000;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
}

.cart-content{
    background:white;
    width:90%;
    max-width:500px;
    margin:70px auto;
    padding:25px;
    border-radius:20px;
}

.close-cart{
    float:right;
    font-size:2rem;
    cursor:pointer;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    margin:15px 0;
}

.total{
    margin-top:20px;
    font-size:1.5rem;
    font-weight:bold;
}

.checkout-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#28a745;
    color:white;
    font-size:1rem;
    margin-top:20px;
    cursor:pointer;
}

/* IMAGE MODAL */

#imageModal{
    display:none;
    position:fixed;
    z-index:5000;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    justify-content:center;
    align-items:center;
}

#modalImage{
    max-width:90%;
    max-height:90%;
    border-radius:20px;
}

.close-image{
    position:absolute;
    top:20px;
    right:30px;
    color:white;
    font-size:45px;
    cursor:pointer;
}

/* FOOTER */

footer{
    background:#333;
    color:white;
    text-align:center;
    padding:40px 20px;
    margin-top:50px;
}

footer a{
    color:#25D366;
}

/* MOBILE */

@media(max-width:768px){

.hero-content h1{
    font-size:2rem;
}

.products-grid{
    grid-template-columns:1fr 1fr;
}

}

</style>
</head>

<body>

<header>

<nav>

<div class="logo">
👜 EZA BAG
</div>

<div class="cart-icon" onclick="toggleCart()">

<i class="fas fa-shopping-cart"></i>

<span class="cart-count" id="cartCount">
0
</span>

</div>

</nav>

</header>

<!-- HERO -->

<section class="hero">

<div class="hero-content">

<h1>EZA BAG OFFICIAL</h1>

<p>
Tas Premium Kualitas Terbaik
</p>

</div>

</section>

<!-- PRODUCTS -->

<section class="products">

<h2 class="section-title">
Koleksi Tas Terbaru
</h2>

<!-- SEARCH -->

<div class="search-container">

<input
type="text"
id="searchInput"
placeholder="Cari tas favorit..."
onkeyup="searchProducts()"
>

<button onclick="searchProducts()">
<i class="fas fa-search"></i>
</button>

</div>

<!-- CATEGORY -->

<div class="categories">

<div class="category-item"
onclick="filterCategory('Semua')">
👜 Semua
</div>

<div class="category-item"
onclick="filterCategory('Mini')">
🎀 Mini
</div>

<div class="category-item"
onclick="filterCategory('Tote')">
🛍 Tote
</div>

<div class="category-item"
onclick="filterCategory('Ransel')">
🎒 Ransel
</div>

<div class="category-item"
onclick="filterCategory('Travel')">
✈ Travel
</div>

</div>

<div class="products-grid" id="productsGrid"></div>

</section>

<!-- CART -->

<div class="cart-modal" id="cartModal">

<div class="cart-content">

<span class="close-cart"
onclick="toggleCart()">
&times;
</span>

<h2>🛒 Keranjang</h2>

<div id="cartItems"></div>

<div class="total">

Total:
<span id="cartTotal">
Rp 0
</span>

</div>

<button class="checkout-btn"
onclick="checkout()">

✅ Checkout

</button>

</div>
</div>

<!-- IMAGE MODAL -->

<div id="imageModal">

<span class="close-image"
onclick="closeImageModal()">
&times;
</span>

<img id="modalImage">

</div>

<!-- FOOTER -->

<footer>

<h2>📞 Hubungi Kami</h2>

<p>
📱 WA:
<a href="https://wa.me/6287877157090">
0878-7715-7090
</a>
</p>

<p>
📧 Email:
eza.bag@gmail.com
</p>

</footer>

<script>

const products = [

{
id:1,
name:'Tas Mini Cantik',
price:490000,
image:'images/Tas-mini-490.png'
},

{
id:2,
name:'Tas Tote Bag Krem',
price:450000,
image:'images/Tote-Bag-krem.png'
},

{
id:3,
name:'Tas Ransel Cantik',
price:470000,
image:'images/Tas-ransel-470.png'
},

{
id:4,
name:'Tas Sekolah Anak',
price:300000,
image:'images/tas-sekolah-300.png'
},

{
id:5,
name:'Tas Sekolah Premium',
price:450000,
image:'images/tas-sekolah-450.png'
},

{
id:6,
name:'Tas Travel Premium',
price:500000,
image:'images/tas-travel-500.png'
}

];

let cart = [];

document.addEventListener('DOMContentLoaded',()=>{

loadProducts();
updateCartCount();

});

function renderProducts(data){

document.getElementById('productsGrid').innerHTML =

data.map(p=>`

<div class="product-card">

<img src="${p.image}"
class="product-image"
onclick="openImageModal('${p.image}')"
onerror="this.src='https://via.placeholder.com/300x300/ee4d2d/ffffff?text=EZA+BAG';">

<div class="product-info">

<h3>${p.name}</h3>

<div class="product-price">
Rp ${p.price.toLocaleString('id-ID')}
</div>

<button class="product-add-to-cart"
onclick="addToCart(${p.id})">

<i class="fas fa-cart-plus"></i>
Beli

</button>

</div>
</div>

`).join('');

}

function loadProducts(){

renderProducts(products);

}

function searchProducts(){

const keyword =
document.getElementById('searchInput')
.value
.toLowerCase();

const filtered = products.filter(product=>

product.name.toLowerCase()
.includes(keyword)

);

renderProducts(filtered);

}

function filterCategory(category){

if(category==='Semua'){

renderProducts(products);
return;

}

const filtered = products.filter(product=>

product.name.toLowerCase()
.includes(category.toLowerCase())

);

renderProducts(filtered);

}

function addToCart(id){

const product =
products.find(x=>x.id===id);

const existing =
cart.find(x=>x.id===id);

if(existing){

existing.quantity++;

}else{

cart.push({...product,quantity:1});

}

updateCartCount();

alert('✅ Ditambahkan ke keranjang');

}

function updateCartCount(){

document.getElementById('cartCount')
.textContent =

cart.reduce(
(sum,item)=>sum+item.quantity,
0
);

}

function toggleCart(){

const modal =
document.getElementById('cartModal');

modal.style.display =

modal.style.display === 'block'
? 'none'
: 'block';

if(modal.style.display==='block'){

displayCart();

}

}

function displayCart(){

const cartItems =
document.getElementById('cartItems');

const total = cart.reduce(
(sum,item)=>sum+(item.price*item.quantity),
0
);

cartItems.innerHTML =

cart.length

?

cart.map(item=>`

<div class="cart-item">

<span>
${item.name} x${item.quantity}
</span>

<span>
Rp ${(item.price*item.quantity).toLocaleString('id-ID')}
</span>

</div>

`).join('')

:

'<p>Keranjang kosong</p>';

document.getElementById('cartTotal')
.textContent =

`Rp ${total.toLocaleString('id-ID')}`;

}

function checkout(){

if(!cart.length){

alert('Keranjang kosong!');
return;

}

const total = cart.reduce(
(sum,item)=>sum+(item.price*item.quantity),
0
);

const pesan = `Halo EZA BAG OFFICIAL 👋

Saya ingin order:

${cart.map(item=>
`${item.name} x${item.quantity}`
).join('\n')}

Total:
Rp ${total.toLocaleString('id-ID')}`;

window.open(
`https://wa.me/6287877157090?text=${encodeURIComponent(pesan)}`,
'_blank'
);

}

function openImageModal(src){

document.getElementById('imageModal')
.style.display='flex';

document.getElementById('modalImage')
.src=src;

}

function closeImageModal(){

document.getElementById('imageModal')
.style.display='none';

}

window.onclick = function(e){

if(e.target.id==='imageModal'){

closeImageModal();

}

if(e.target.id==='cartModal'){

toggleCart();

}

}

</script>

</body>
</html>
