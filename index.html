<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>👜 EZA BAG OFFICIAL</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#667eea">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#333;
}

/* HEADER */
header{
    position:fixed;
    top:0;
    width:100%;
    z-index:1000;
    background:rgba(102,126,234,0.9);
    backdrop-filter:blur(10px);
    padding:18px 0;
    box-shadow:0 4px 20px rgba(0,0,0,0.15);
}

nav{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
}

.logo{
    color:white;
    font-size:2rem;
    font-weight:bold;
}

.nav-links{
    display:flex;
    gap:30px;
    list-style:none;
}

.nav-links a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.cart-icon{
    position:relative;
    color:white;
    font-size:1.5rem;
    cursor:pointer;
}

.cart-count{
    position:absolute;
    top:-10px;
    right:-10px;
    background:red;
    color:white;
    width:20px;
    height:20px;
    border-radius:50%;
    font-size:12px;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* HERO */
.hero{
    margin-top:80px;
    min-height:500px;
    background:
    linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
    url('https://images.unsplash.com/photo-1584917865442-de89df76afd3?q=80&w=1200&auto=format&fit=crop');

    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    padding:20px;
}
.hero-content h1{
    font-size:3rem;
    margin-bottom:15px;
}

.hero-content p{
    font-size:1.2rem;
    margin-bottom:20px;
}

.cta-button{
    background:#ff6b6b;
    color:white;
    padding:15px 30px;
    border-radius:50px;
    text-decoration:none;
    font-weight:bold;
}

.cta-button:hover{
    background:#ff5252;
}

/* PRODUCTS */
.products{
    max-width:1200px;
    margin:auto;
    padding:80px 20px;
}

.section-title{
    text-align:center;
    font-size:2.5rem;
    margin-bottom:50px;
}

.products-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:30px;
}

.product-card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    transition:0.3s;
}

.product-card:hover{
    transform:translateY(-10px);
}

.product-image{
    width:70%;
    height:180px;
    object-fit:contain;
    display:block;
    margin:20px auto 10px;
    cursor:pointer;
    transition:0.3s;
}

.product-image:hover{
    transform:scale(1.05);
}

.product-info{
    padding:20px;
}

.product-info h3{
    margin-bottom:10px;
}

.product-price{
    color:#ff6b6b;
    font-size:1.7rem;
    font-weight:bold;
    margin-bottom:15px;
}

.product-add-to-cart{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    font-size:1rem;
    cursor:pointer;
}

.product-add-to-cart:hover{
    transform:scale(1.03);
}

/* CART */
.cart-modal{
    display:none;
    position:fixed;
    z-index:3000;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
}

.cart-content{
    background:white;
    width:90%;
    max-width:500px;
    margin:80px auto;
    padding:25px;
    border-radius:20px;
}

.close-cart{
    float:right;
    font-size:2rem;
    cursor:pointer;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    margin:15px 0;
}

.total{
    margin-top:20px;
    font-size:1.5rem;
    font-weight:bold;
}

.checkout-btn{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#28a745;
    color:white;
    font-size:1rem;
    cursor:pointer;
}

/* IMAGE MODAL */
#imageModal{
    display:none;
    position:fixed;
    z-index:5000;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow:auto;
}

#modalImage{
    max-width:95%;
    max-height:95vh;
    width:auto;
    height:auto;
    object-fit:contain;
    border-radius:20px;
}

.close-image{
    position:absolute;
    top:20px;
    right:35px;
    color:white;
    font-size:45px;
    cursor:pointer;
}

/* FOOTER */
footer{
    background:#333;
    color:white;
    text-align:center;
    padding:40px 20px;
}

footer a{
    color:#25D366;
}

/* MOBILE */
@media(max-width:768px){

    .nav-links{
        display:none;
    }

    .hero-content h1{
        font-size:2rem;
    }

    .section-title{
        font-size:2rem;
    }

}

</style>
</head>

<body>

<header>
<nav>

<div class="logo">
👜 EZA BAG OFFICIAL
</div>

<ul class="nav-links">
<li><a href="#">Home</a></li>
<li><a href="#products">Produk</a></li>
<li><a href="#contact">Kontak</a></li>
</ul>

<div class="cart-icon" onclick="toggleCart()">
<i class="fas fa-shopping-cart"></i>
<span class="cart-count" id="cartCount">0</span>
</div>

</nav>
</header>

<!-- HERO -->
<section class="hero">

<div class="hero-content">

<h1>EZA BAG OFFICIAL</h1>

<p>
Tas Premium Kualitas Terbaik
</p>

<a href="#products" class="cta-button">
🛒 Lihat Koleksi
</a>

</div>
</section>

<!-- PRODUCTS -->
<section class="products" id="products">

<h2 class="section-title">
Koleksi Tas EZA BAG Terbaru
</h2>

<div class="products-grid" id="productsGrid"></div>

</section>

<!-- CART -->
<div class="cart-modal" id="cartModal">

<div class="cart-content">

<span class="close-cart" onclick="toggleCart()">
&times;
</span>

<h2>🛒 Keranjang</h2>

<div id="cartItems"></div>

<div class="total">
Total:
<span id="cartTotal">Rp 0</span>
</div>

<button class="checkout-btn" onclick="checkout()">
✅ Checkout
</button>

</div>
</div>

<!-- IMAGE MODAL -->
<div id="imageModal">

<span class="close-image" onclick="closeImageModal()">
&times;
</span>

<img id="modalImage">

</div>

<!-- FOOTER -->
<footer id="contact">

<h2>📞 Hubungi Kami</h2>

<p>
📱 WA:
<a href="https://wa.me/6287877157090">
0878-7715-7090
</a>
</p>

<p>
📧 Email: eza.bag@gmail.com
</p>

<p>
© 2024 EZA BAG OFFICIAL
</p>

</footer>

<script>

const products = [

{
id:1,
name:'Tas Mini Cantik',
price:490000,
image:'images/Tas-mini-490.png'
},

{
id:2,
name:'Tas Tote Bag Krem',
price:450000,
image:'images/Tote-Bag-krem.png'
},

{
id:3,
name:'Tas Ransel Cantik',
price:470000,
image:'images/Tas-ransel-470.png'
},

{
id:4,
name:'Tas Sekolah Anak',
price:300000,
image:'images/tas-sekolah-300.png'
},

{
id:5,
name:'Tas Sekolah Premium',
price:450000,
image:'images/tas-sekolah-450.png'
},

{
id:6,
name:'Tas Travel Premium',
price:500000,
image:'images/tas-travel-500.png'
}

];

let cart = [];

document.addEventListener('DOMContentLoaded',()=>{

loadProducts();
updateCartCount();

});

function loadProducts(){

document.getElementById('productsGrid').innerHTML =
products.map(p=>`

<div class="product-card">

<img src="${p.image}"
alt="${p.name}"
class="product-image"
onclick="openImageModal('${p.image}')"
onerror="this.src='https://via.placeholder.com/300x300/667eea/ffffff?text=EZA+BAG';">

<div class="product-info">

<h3>${p.name}</h3>

<div class="product-price">
Rp ${p.price.toLocaleString('id-ID')}
</div>

<button class="product-add-to-cart"
onclick="addToCart(${p.id})">

<i class="fas fa-cart-plus"></i>
Beli

</button>

</div>
</div>

`).join('');

}

function addToCart(id){

const product = products.find(x=>x.id===id);

const existing = cart.find(x=>x.id===id);

if(existing){

existing.quantity++;

}else{

cart.push({...product,quantity:1});

}

updateCartCount();

showNotification('✅ Ditambahkan ke keranjang');

}

function updateCartCount(){

document.getElementById('cartCount').textContent =
cart.reduce((sum,item)=>sum+item.quantity,0);

}

function toggleCart(){

const modal = document.getElementById('cartModal');

modal.style.display =
modal.style.display === 'block'
? 'none'
: 'block';

if(modal.style.display === 'block'){

displayCart();

}

}

function displayCart(){

const cartItems = document.getElementById('cartItems');

const total = cart.reduce(
(sum,item)=>sum+(item.price*item.quantity),0);

cartItems.innerHTML =
cart.length
?

cart.map(item=>`

<div class="cart-item">

<span>
${item.name} x${item.quantity}
</span>

<span>
Rp ${(item.price*item.quantity).toLocaleString('id-ID')}
</span>

</div>

`).join('')

:

'<p>Keranjang kosong</p>';

document.getElementById('cartTotal').textContent =
`Rp ${total.toLocaleString('id-ID')}`;

}

function openImageModal(src){

document.getElementById('imageModal').style.display='flex';

document.getElementById('modalImage').src=src;

}

function closeImageModal(){

document.getElementById('imageModal').style.display='none';

}

window.onclick = function(e){

if(e.target.id==='imageModal'){

closeImageModal();

}

if(e.target.id==='cartModal'){

toggleCart();

}

};

function checkout(){

if(!cart.length){

alert('Keranjang kosong!');
return;

}

const total = cart.reduce(
(sum,item)=>sum+(item.price*item.quantity),0
);

const bank = 'BNI';
const norek = '1988112715';
const atasNama = 'AHMAD SYAI';

const detailOrder = cart.map(item =>

`• ${item.name}
Qty : ${item.quantity}
Subtotal : Rp ${(item.price * item.quantity).toLocaleString('id-ID')}`

).join('\n\n');

const pesan = `Halo EZA BAG OFFICIAL 👋

Saya ingin melakukan pemesanan:

${detailOrder}

========================
TOTAL PEMBAYARAN
Rp ${total.toLocaleString('id-ID')}
========================

PEMBAYARAN TRANSFER:
Bank : ${bank}
No Rek : ${norek}
Atas Nama : ${atasNama}

Mohon konfirmasi setelah transfer 🙏`;

alert(
`✅ PESANAN BERHASIL DIBUAT

Silakan lakukan pembayaran:

========================
BANK : ${bank}
NO REK : ${norek}
A/N : ${atasNama}
========================

TOTAL:
Rp ${total.toLocaleString('id-ID')}

Setelah transfer klik OK
untuk lanjut ke WhatsApp`
);

window.location.href =
`https://wa.me/6287877157090?text=${encodeURIComponent(pesan)}`;

cart = [];

updateCartCount();

toggleCart();

}

function showNotification(text){

const notif = document.createElement('div');

notif.style.cssText = `
position:fixed;
top:100px;
right:20px;
background:#28a745;
color:white;
padding:15px 20px;
border-radius:10px;
z-index:6000;
font-weight:bold;
`;

notif.textContent = text;

document.body.appendChild(notif);

setTimeout(()=>{

notif.remove();

},2000);

}

</script>
<script>

if('serviceWorker' in navigator){

  window.addEventListener('load', ()=>{

    navigator.serviceWorker.register('service-worker.js');

  });

}

</script>
</body>
</html>
